<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- NamiBench: 大波（神奈川沖浪裏の波頭を元にした描き起こし）と富士。色は藍・白・生成りの3色に絞る -->
  <rect x="0" y="0" width="64" height="64" rx="12" fill="#f3ead8"/>
  <!-- 富士 -->
  <path d="M38 50 L46 38 L54 50 Z" fill="#1f3a5f"/>
  <path d="M43.4 41.9 L46 38 L48.6 41.9 L47.2 41.2 L46 42.4 L44.8 41.2 Z" fill="#f3ead8"/>
  <!-- 大波（巻き込む波頭） -->
  <path d="M6 56 C6 38 14 20 30 14 C40 10.5 50 13 54 20 C47 17 40 18.5 36 23
           C32 28 33 35 39 38 C34 38.5 29 36 27 31 C24 38 22 47 24 56 Z" fill="#1f3a5f"/>
  <!-- 波頭の白（爪のような泡） -->
  <path d="M30 14 C40 10.5 50 13 54 20 C51 19.2 49 19.6 47 20.6 C48.5 18.8 46 18 44 19.4
           C44.6 17.4 42 17 40.4 18.8 C40.6 16.8 38 16.8 36.8 19 C36.4 17.4 34 17.6 33.2 19.8
           C33 17.6 31.4 17.2 30 18.6 C30.8 16.6 30.6 15.2 30 14 Z" fill="#ffffff"/>
  <!-- 波の筋 -->
  <path d="M11 52 C11 40 17 28 27 22" fill="none" stroke="#7fa7c9" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M17 54 C17 44 21 35 28 29" fill="none" stroke="#7fa7c9" stroke-width="2" stroke-linecap="round"/>
  <!-- 手前の小波 -->
  <path d="M24 56 C30 48 36 47 42 51 C46 49 50 50 58 56 Z" fill="#2c5282"/>
  <path d="M30 51.5 C33 49 37 48.6 40.5 50.6" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
</svg>
